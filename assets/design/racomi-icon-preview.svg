<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">racomi 图标设计</title>
  <desc id="desc">几何浣熊图标。浅色与深色应用图标、透明单色标志，以及 16、24、32、48、64 像素的尺寸预览。所有图形均为独立矢量路径。</desc>
  <defs><symbol fill="none" id="light" viewBox="0 0 512 512">


