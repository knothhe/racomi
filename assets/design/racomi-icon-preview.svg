  <rect width="1200" height="680" fill="#F8F9F5"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', sans-serif">
    <text x="40" y="56" fill="#242C29" font-size="29" font-weight="650" letter-spacing="-.8">racomi</text>
    <text x="1160" y="53" fill="#778078" font-size="12" letter-spacing="1.5" text-anchor="end">ICON DESIGN / SVG</text>
    <rect x="40" y="88" width="548" height="394" rx="20" fill="#ECEFE7"/>
    <rect x="612" y="88" width="548" height="394" rx="20" fill="#121A16"/>
    <use href="#light" x="135" y="105" width="358" height="358"/>
    <use href="#dark" x="707" y="105" width="358" height="358"/>
    <text x="64" y="120" fill="#667166" font-size="11" letter-spacing="1.3">01 / LIGHT</text>
    <text x="636" y="120" fill="#91A194" font-size="11" letter-spacing="1.3">02 / DARK</text>
    <text x="40" y="523" fill="#242C29" font-size="14" font-weight="500">几何浣熊 · 石墨黑与暖瓷白</text>
    <text x="1160" y="523" fill="#778078" font-size="12" text-anchor="end">实心眼罩 / 对称轮廓 / 透明负形</text>
    <path d="M40 546H1160" stroke="#DFE4DB"/>
    <text x="40" y="580" fill="#778078" font-size="11" letter-spacing="1.1">03 / SYMBOL</text>
    <use href="#symbol" x="40" y="590" width="58" height="58" color="#242C29"/>
    <rect x="118" y="586" width="66" height="66" rx="14" fill="#242C29"/>
    <use href="#symbol" x="122" y="590" width="58" height="58" color="#F2F3E9"/>
    <text x="216" y="613" fill="#667166" font-size="12">透明底，单色</text>
    <text x="216" y="635" fill="#899186" font-size="11">可直接编辑路径与颜色</text>
    <text x="540" y="580" fill="#778078" font-size="11" letter-spacing="1.1">04 / SIZE CHECK</text>
    <use href="#light" x="540" y="606" width="16" height="16"/>
    <use href="#light" x="605" y="602" width="24" height="24"/>
    <use href="#light" x="678" y="598" width="32" height="32"/>
    <use href="#light" x="759" y="590" width="48" height="48"/>
    <use href="#light" x="856" y="582" width="64" height="64"/>
    <text x="548" y="662" text-anchor="middle" fill="#899186" font-size="10">16</text>
    <text x="617" y="662" text-anchor="middle" fill="#899186" font-size="10">24</text>
    <text x="694" y="662" text-anchor="middle" fill="#899186" font-size="10">32</text>
    <text x="783" y="662" text-anchor="middle" fill="#899186" font-size="10">48</text>
    <text x="888" y="662" text-anchor="middle" fill="#899186" font-size="10">64 px</text>
    <text x="1160" y="613" text-anchor="end" fill="#667166" font-size="12">纯 SVG 矢量</text>
    <text x="1160" y="635" text-anchor="end" fill="#899186" font-size="11">无位图 / 无外部资源</text>
  </g>
</svg>
