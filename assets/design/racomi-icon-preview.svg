      <stop stop-color="#FCFCF8"/>
      <stop offset="1" stop-color="#E8EAE3"/>
    </linearGradient>
    <filter id="light-shadow" x="16" y="24" width="480" height="484" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dy="9" stdDeviation="10" flood-color="#18221E" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect x="44" y="44" width="424" height="424" rx="96" fill="url(#light-surface)" filter="url(#light-shadow)"/>
  <rect x="44.75" y="44.75" width="422.5" height="422.5" rx="95.25" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.5"/>
