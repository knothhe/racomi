</symbol>
<symbol fill="none" id="dark" viewBox="0 0 512 512">


  <defs>
    <linearGradient id="dark-surface" x1="256" y1="44" x2="256" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343D38"/>
