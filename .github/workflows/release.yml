name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      release: true

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            RELEASE_TAG="v$(node -p "require('./frontend/package.json').version")"
            export RELEASE_TAG
          fi
          test "${RELEASE_TAG:0:1}" = v
          node --input-type=module -e 'import { parse } from "./scripts/release.mjs"; parse(process.env.RELEASE_TAG.slice(1));'
          test "$(node -p "require('./frontend/package.json').version")" = "${RELEASE_TAG#v}"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(go env GOARCH)" = amd64
          channel=stable
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then channel=preview; fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
      # GTK 3 with WebKit2GTK 4.1 is the most widely packaged runtime pair.
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies and verify
        run: |
          make deps GTK=3
          make check GTK=3
      - name: Package exact release
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          make dist GTK=3 CHANNEL="$RELEASE_CHANNEL" BUILD_EXECUTOR=ci VERSION="${RELEASE_TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" GOARCH=amd64 SOURCE_COMMIT="$GITHUB_SHA" SOURCE_DIRTY=false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-linux-x86_64
          path: |
            bin/releases/racomi-*-x86_64-linux.tar.gz
            bin/releases/racomi-*-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  build:
    name: macOS Apple Silicon
    # Sparkle's signing tools also sign the Linux and Windows update archives.
    needs: [linux, windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
            RELEASE_TAG="v$(node -p "require('./frontend/package.json').version")"
            export RELEASE_TAG
          fi
          test "${RELEASE_TAG:0:1}" = v
          node --input-type=module -e 'import { parse } from "./scripts/release.mjs"; parse(process.env.RELEASE_TAG.slice(1));'
          test "$(node -p "require('./frontend/package.json').version")" = "${RELEASE_TAG#v}"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(go env GOARCH)" = arm64
          xcrun --find clang
          channel=stable
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then channel=preview; fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Install dependencies and verify
        run: |
          make deps
          make check
      - name: Package exact release
        run: |
          # Generators may rewrite checked-in icon outputs; authoritative source
          # files must still match the clean tag captured before the checks.
          test -z "$(git status --porcelain --untracked-files=normal -- . ':(exclude)build/appicon.png' ':(exclude)build/appicon-dark.png' ':(exclude)build/macos/Assets.car' ':(exclude)build/macos/racomi.icns' ':(exclude)frontend/public/appicon.png')"
          make dist CHANNEL="$RELEASE_CHANNEL" BUILD_EXECUTOR=ci VERSION="${RELEASE_TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" GOARCH=arm64 SOURCE_COMMIT="$GITHUB_SHA" SOURCE_DIRTY=false
      - name: Sign stable update archive and feed
        if: env.RELEASE_CHANNEL == 'stable' && startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh scripts/create-appcast.sh "${RELEASE_TAG#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/download-artifact@v8.0.1
        if: env.RELEASE_CHANNEL == 'stable' && startsWith(github.ref, 'refs/tags/')
        with:
          name: racomi-linux-x86_64
          path: bin/releases
      - name: Sign stable Linux archive and feed
        if: env.RELEASE_CHANNEL == 'stable' && startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          (cd bin/releases && shasum -a 256 -c "racomi-${RELEASE_TAG#v}-x86_64-linux.tar.gz.sha256")
          sh scripts/create-linux-feed.sh "${RELEASE_TAG#v}" "$GITHUB_SHA"
      - uses: actions/download-artifact@v8.0.1
        if: env.RELEASE_CHANNEL == 'stable' && startsWith(github.ref, 'refs/tags/')
        with:
          name: racomi-windows-x86_64
          path: bin/releases
      - name: Sign stable Windows archive and feed
        if: env.RELEASE_CHANNEL == 'stable' && startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          (cd bin/releases && shasum -a 256 -c "racomi-${RELEASE_TAG#v}-x86_64-windows.zip.sha256")
          sh scripts/create-windows-feed.sh "${RELEASE_TAG#v}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-macos-arm64
          path: |
            bin/releases/racomi-*-aarch64-macos.zip
            bin/releases/racomi-*-aarch64-macos.zip.sha256
            bin/releases/appcast.xml
            bin/releases/linux-update.json
            bin/releases/windows-update.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: racomi-*
          merge-multiple: true
          path: release-assets
      - name: Verify, stage and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat build/RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          printf '\n' >> "$RUNNER_TEMP/release-notes.md"
          make --silent release-notes RELEASE_REPO="$GH_REPO" RELEASE_TAG="$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          cd release-assets
          archive="racomi-${RELEASE_TAG#v}-aarch64-macos.zip"
          linux_archive="racomi-${RELEASE_TAG#v}-x86_64-linux.tar.gz"
          windows_archive="racomi-${RELEASE_TAG#v}-x86_64-windows.zip"
          assets=()
          for file in "$archive" "$linux_archive" "$windows_archive"; do
            test -f "$file"
            test -f "$file.sha256"
            sha256sum --check "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          args=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            args+=(--prerelease)
          else
            test -s appcast.xml
            test -s linux-update.json
            test -s windows-update.json
            node ../scripts/verify-linux-feed.mjs verify linux-update.json "${RELEASE_TAG#v}" "$GITHUB_SHA" .
            node ../scripts/verify-windows-feed.mjs verify windows-update.json "${RELEASE_TAG#v}" "$GITHUB_SHA" .
            assets+=(appcast.xml linux-update.json windows-update.json)
          fi
          # Retried jobs may resume this exact draft; refuse published releases.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > release-pages.json
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' release-pages.json > release-state.json
          test "$(jq length release-state.json)" -le 1
          if [[ "$(jq length release-state.json)" = 1 ]]; then
            test "$(jq -r '.[0].draft' release-state.json)" = true
            for asset in "${assets[@]}"; do
              mkdir -p previous
              if jq -e --arg name "$asset" '.[0].assets | any(.name == $name)' release-state.json >/dev/null; then
                gh release download "$RELEASE_TAG" --pattern "$asset" --dir previous
                cmp "$asset" "previous/$asset"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag --title "racomi $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
          mkdir -p published
          for asset in "${assets[@]}"; do
            curl --fail --location --retry 3 "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$asset" --output "published/$asset"
            cmp "$asset" "published/$asset"
          done
