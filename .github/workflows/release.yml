name: Desktop Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-binutils mingw-w64-ucrt-x86_64-make
      - name: Select native MinGW tools
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_LOCATION\ucrt64\bin" >> $env:GITHUB_PATH
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Release tag/version mismatch' }
          node --input-type=module -e 'import {parse} from "./scripts/release.mjs"; parse(process.argv[1])' $version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release version' }
          if (git status --porcelain --untracked-files=normal) { throw 'Dirty checkout' }
          if ((go env GOARCH) -ne 'amd64') { throw 'Expected Windows x64' }
          $channel = if (($version -split '\+')[0].Contains('-')) { 'preview' } else { 'stable' }
          "RELEASE_CHANNEL=$channel" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install dependencies and verify
        run: |
          mingw32-make deps
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          mingw32-make check
          if ($LASTEXITCODE -ne 0) { throw 'Windows checks failed' }
      - name: Verify native window lifecycle
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: |
          go run -tags production,nativeintegration -ldflags="-s=false -w=false" ./internal/desktop/testdata/window-lifecycle-windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows lifecycle verification failed' }
      - name: Package exact release
        run: |
          mingw32-make dist "CHANNEL=$env:RELEASE_CHANNEL" BUILD_EXECUTOR=ci "VERSION=$env:RELEASE_VERSION" "BUILD_NUMBER=$env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows-artifact.test.ps1 -Channel $env:RELEASE_CHANNEL -Executor ci -BuildNumber $env:GITHUB_RUN_NUMBER
          if ($LASTEXITCODE -ne 0) { throw 'Windows artifact verification failed' }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-windows-x86_64
          path: |
            bin/releases/racomi-*-x86_64-windows.zip
            bin/releases/racomi-*-x86_64-windows.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG:0:1}" = v
          node --input-type=module -e 'import { parse } from "./scripts/release.mjs"; parse(process.env.RELEASE_TAG.slice(1));'
          test "$(node -p "require('./frontend/package.json').version")" = "${RELEASE_TAG#v}"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(go env GOARCH)" = amd64
          channel=stable
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then channel=preview; fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
      # GTK 3 with WebKit2GTK 4.1 is the most widely packaged runtime pair.
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install dependencies and verify
        run: |
          make deps GTK=3
          make check GTK=3
      - name: Package exact release
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          make dist GTK=3 CHANNEL="$RELEASE_CHANNEL" BUILD_EXECUTOR=ci VERSION="${RELEASE_TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" GOARCH=amd64 SOURCE_COMMIT="$GITHUB_SHA" SOURCE_DIRTY=false
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-linux-x86_64
          path: |
            bin/releases/racomi-*-x86_64-linux.tar.gz
            bin/releases/racomi-*-x86_64-linux.tar.gz.sha256
          if-no-files-found: error

  build:
    name: macOS Apple Silicon
    # Sparkle's signing tools also sign the Linux and Windows update archives.
    needs: [linux, windows]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "${RELEASE_TAG:0:1}" = v
          node --input-type=module -e 'import { parse } from "./scripts/release.mjs"; parse(process.env.RELEASE_TAG.slice(1));'
          test "$(node -p "require('./frontend/package.json').version")" = "${RELEASE_TAG#v}"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(go env GOARCH)" = arm64
          xcrun --find clang
          channel=stable
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then channel=preview; fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Install dependencies and verify
        run: |
          make deps
          make check
      - name: Package exact release
        run: |
          # Generators may rewrite checked-in icon outputs; authoritative source
          # files must still match the clean tag captured before the checks.
          test -z "$(git status --porcelain --untracked-files=normal -- . ':(exclude)build/appicon.png' ':(exclude)build/appicon-dark.png' ':(exclude)build/macos/Assets.car' ':(exclude)build/macos/racomi.icns' ':(exclude)frontend/public/appicon.png')"
          make dist CHANNEL="$RELEASE_CHANNEL" BUILD_EXECUTOR=ci VERSION="${RELEASE_TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" GOARCH=arm64 SOURCE_COMMIT="$GITHUB_SHA" SOURCE_DIRTY=false
      - name: Sign stable update archive and feed
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: sh scripts/create-appcast.sh "${RELEASE_TAG#v}" "$GITHUB_RUN_NUMBER"
      - uses: actions/download-artifact@v8.0.1
        if: env.RELEASE_CHANNEL == 'stable'
        with:
          pattern: racomi-*-x86_64
          merge-multiple: true
          path: bin/releases
      - name: Sign stable Linux and Windows archives and feed
        if: env.RELEASE_CHANNEL == 'stable'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          (cd bin/releases && shasum -a 256 -c "racomi-${RELEASE_TAG#v}-x86_64-linux.tar.gz.sha256" "racomi-${RELEASE_TAG#v}-x86_64-windows.zip.sha256")
          sh scripts/create-update-feed.sh "${RELEASE_TAG#v}" "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-macos-arm64
          path: |
            bin/releases/racomi-*-aarch64-macos.zip
            bin/releases/racomi-*-aarch64-macos.zip.sha256
            bin/releases/appcast.xml
            bin/releases/update.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: racomi-*
          merge-multiple: true
          path: release-assets
      - name: Verify, stage and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat build/RELEASE_NOTES.md > "$RUNNER_TEMP/release-notes.md"
          printf '\n' >> "$RUNNER_TEMP/release-notes.md"
          make --silent release-notes RELEASE_REPO="$GH_REPO" RELEASE_TAG="$RELEASE_TAG" >> "$RUNNER_TEMP/release-notes.md"
          cd release-assets
          archive="racomi-${RELEASE_TAG#v}-aarch64-macos.zip"
          linux_archive="racomi-${RELEASE_TAG#v}-x86_64-linux.tar.gz"
          windows_archive="racomi-${RELEASE_TAG#v}-x86_64-windows.zip"
          assets=()
          for file in "$archive" "$linux_archive" "$windows_archive"; do
            test -f "$file"
            test -f "$file.sha256"
            sha256sum --check "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          # releases/latest/download/install.sh always matches the latest archives.
          cp ../scripts/install.sh install.sh
          assets+=(install.sh)
          args=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            args+=(--prerelease)
          else
            test -s appcast.xml
            test -s update.json
            node ../scripts/update-feed.mjs verify update.json "${RELEASE_TAG#v}" "$GITHUB_SHA" .
            assets+=(appcast.xml update.json)
          fi
          # Retried jobs may resume this exact draft; refuse published releases.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > release-pages.json
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]' release-pages.json > release-state.json
          test "$(jq length release-state.json)" -le 1
          if [[ "$(jq length release-state.json)" = 1 ]]; then
            test "$(jq -r '.[0].draft' release-state.json)" = true
            for asset in "${assets[@]}"; do
              mkdir -p previous
              if jq -e --arg name "$asset" '.[0].assets | any(.name == $name)' release-state.json >/dev/null; then
                gh release download "$RELEASE_TAG" --pattern "$asset" --dir previous
                cmp "$asset" "previous/$asset"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --draft --verify-tag --title "racomi $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
          mkdir -p published
          for asset in "${assets[@]}"; do
            curl --fail --location --retry 3 "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$asset" --output "published/$asset"
            cmp "$asset" "published/$asset"
          done
