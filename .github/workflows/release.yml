name: Desktop Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate tag and native architecture
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          test "${RELEASE_TAG:0:1}" = v
          node --input-type=module -e 'import { parse } from "./scripts/release.mjs"; parse(process.env.RELEASE_TAG.slice(1));'
          test "$(node -p "require('./frontend/package.json').version")" = "${RELEASE_TAG#v}"
          test "$(go env GOARCH)" = "$BUILD_ARCH"
          xcrun --find clang
      - name: Install dependencies and verify
        run: |
          make deps
          make check
      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: make dist VERSION="${RELEASE_TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" GOARCH="$BUILD_ARCH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-macos-${{ matrix.arch }}
          path: |
            bin/releases/*.zip
            bin/releases/*.sha256
          if-no-files-found: error

  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Windows build tools
        run: |
          choco install mingw make --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          "PATH=$env:PATH;$machinePath;$userPath" >> $env:GITHUB_ENV
      - name: Validate version, verify and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          node --input-type=module -e 'import { parse } from "./scripts/release.mjs"; parse(process.env.RELEASE_TAG.slice(1));'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content frontend/package.json -Raw | ConvertFrom-Json).version -ne $version) { throw 'Tag/version mismatch' }
          make deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          make check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          make dist "VERSION=$version" "BUILD_NUMBER=$env:GITHUB_RUN_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: racomi-windows-amd64
          path: |
            bin/releases/*.zip
            bin/releases/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: racomi-*
          merge-multiple: true
          path: release-assets
      - name: Verify and publish all desktop packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          test -f "racomi-${RELEASE_TAG#v}-aarch64-macos.zip"
          test -f "racomi-${RELEASE_TAG#v}-x86_64-macos.zip"
          test -f "racomi-${RELEASE_TAG#v}-aarch64-macos.zip.sha256"
          test -f "racomi-${RELEASE_TAG#v}-x86_64-macos.zip.sha256"
          test -f "racomi-${RELEASE_TAG#v}-x86_64-windows.zip"
          test -f "racomi-${RELEASE_TAG#v}-x86_64-windows.zip.sha256"
          sha256sum --check ./*.sha256
          args=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 \
            --verify-tag --title "racomi $RELEASE_TAG" \
            --generate-notes --notes-file ../build/RELEASE_NOTES.md "${args[@]}"
