<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="board.css"><link rel="stylesheet" href="cloud-r2.css"><script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get('theme')||'light'</script><title>同步配置 · ready</title></head><body><header class="header"><span class="brand">◈ Racomi</span><nav class="nav"><span>技能</span><span>项目</span><span>来源</span><span class="active">设置</span></nav></header><main class="page"><h1>备份与迁移</h1></main><div class="overlay"><section class="modal" role="dialog" aria-modal="true"><header class="modal-head"><h1>S3 / R2 同步</h1><p>连接私有存储桶，所有设备使用相同的加密口令。</p></header><div class="modal-body"><div class="methods"><span class="active">Cloudflare R2</span><span class="">手动 S3</span></div><p class="help" style="margin-bottom:16px">切换方式只更改当前编辑，保存后生效。两种方式的配置分别保留。</p><section class="connection "><strong>Cloudflare 已连接</strong><p>选择私有存储桶，racomi 会创建仅能访问该桶的凭据。</p><button class="button">重新授权</button></section><div class="grid" style="margin-bottom:18px"><label class="field wide">Cloudflare 账号<select><option>个人账号</option></select></label><label class="field">数据辖区<select><option>默认</option></select></label><label class="field">存储桶<select><option>racomi-sync</option></select></label></div><section class="connection"><strong>R2 凭据已准备</strong><p>racomi-sync</p><div class="endpoint">https://example.r2.cloudflarestorage.com</div><p>测试连接并保存后，使用此存储桶同步。</p></section><div class="grid"><label class="field wide">对象前缀<input value="racomi"><small>使用相同前缀的设备共享技能库。</small></label><label class="field wide">加密口令<input type="password" placeholder="已保存；留空保留"><small>所有设备使用同一口令。Cloudflare 授权不会替代加密口令。</small></label><label class="check"><input type="checkbox">应用开启时自动双向同步</label><label class="field">同步间隔（分钟）<input type="number" value="5"></label></div><p class="note">授权、连接测试和切换选项均不会开始同步。保存后点击“立即同步”。</p></div><footer class="foot"><small>当前生效：手动 S3</small><button class="button">取消</button><button class="button">测试连接</button><button class="button primary">保存同步设置</button></footer></section></div></body></html>
